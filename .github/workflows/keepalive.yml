# Empêche la mise en pause du projet Supabase gratuit après 7 jours de faible activité.
# Fait une vraie requête en base une fois par jour.
name: keepalive

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours à 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête sur la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/vehicules?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          if [ "$code" -ge 500 ]; then exit 1; fi
